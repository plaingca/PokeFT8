name: Tests
on: [push, pull_request]
jobs:
  telemetry:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -v
      - run: python -m compileall -q app.py engine.py protocol.py rom.py game_audio.py demo.py prepare_reference.py ecology.py
