name: Portable packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build.txt
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-6 libxext6 libxrender1 libxss1 libtk8.6
      - name: Test radio and packaging rules
        run: python -m unittest discover -v
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare checksum-verified symbols (no ROM)
        run: python prepare_reference.py
      - name: Build and smoke-test Windows or macOS package
        if: runner.os != 'Linux'
        run: python packaging/build_package.py --label ${{ matrix.label }}
      - name: Build and smoke-test Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build_package.py --label ${{ matrix.label }}
      - name: Upload portable archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: PokeFT8-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-check-${{ matrix.label }}
          path: build/self-test-*.json
          if-no-files-found: ignore

  release:
    name: Attach packages to a draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PokeFT8-*
          path: packages
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Refusing to replace assets on an already-published release."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" packages/* --clobber
          else
            gh release create "$RELEASE_TAG" packages/* --draft --verify-tag --title "PokeFT8 $RELEASE_TAG" --notes "Portable Windows, Linux, Apple Silicon and Intel macOS packages. Extract the whole archive and supply your own supported Pokemon Red ROM."
          fi
